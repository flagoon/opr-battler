{% extends "base.html" %}

{% block content%}
<div
    class="grid grid-flow-row grid-cols-3 gap-4 container mx-auto mt-12 bg-slate-500 border-2 rounded-lg border-slate-200 p-4">
    {% for key in armies %}
    <div class="flex">
        <div><img src="{{ armies.get(key)['coverImagePath']}}" />{{armies.get(key)['name']}}</div>
    </div>
    {% endfor %}
</div>

{% endblock content%}
